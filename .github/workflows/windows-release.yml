name: Windows Release

on:
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#win-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/ClaudeGraft/ClaudeGraft.csproj -r win-x64

      - name: Publish
        run: >
          dotnet publish windows/ClaudeGraft/ClaudeGraft.csproj
          -c Release
          -p:Platform=x64
          -p:GraftVersion=${{ steps.version.outputs.version }}
          -o windows/dist/ClaudeGraft
          --no-restore

      # A framework-dependent exe beside the launcher's bundled runtime will not
      # start at all, so a build that lost self-contained must not ship.
      - name: Check both executables carry their runtime
        shell: pwsh
        run: |
          foreach ($name in 'ClaudeGraft', 'GraftLaunch') {
            $config = Get-Content "windows/dist/ClaudeGraft/$name.runtimeconfig.json" -Raw
            if ($config -notmatch 'includedFrameworks') { throw "$name was published framework-dependent" }
          }

      # Sidebar sync skips silently without it, so a release missing it looks fine.
      - name: Stage bundled Electron
        shell: pwsh
        run: |
          ./windows/fetch-electron.ps1
          # Without it electron.exe exits 1 on the helper's folder, and every sync fails.
          if (-not (Test-Path windows/dist/ClaudeGraft/electron/resources/default_app.asar)) {
            throw "Electron was staged without default_app.asar"
          }

      - name: Install vpk
        # The same version as the Velopack package ClaudeGraft.csproj references.
        run: dotnet tool install -g vpk --version 1.2.161

      # A delta is made against the last Windows release's package; the first has none to fetch.
      - name: Fetch the previous release
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o windows/dist/velopack

      - name: Pack
        run: >
          vpk pack
          --packId ClaudeGraftApp
          --packVersion ${{ steps.version.outputs.version }}
          --packDir windows/dist/ClaudeGraft
          --mainExe ClaudeGraft.exe
          --packTitle "Claude Graft"
          --packAuthors "Claude Graft"
          --icon windows/ClaudeGraft/Assets/AppIcon.ico
          --releaseNotes windows/release-notes/${{ steps.version.outputs.version }}.md
          --shortcuts StartMenuRoot
          --framework vcredist143-x64
          -o windows/dist/velopack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: windows/release-notes/${{ steps.version.outputs.version }}.md
          # Only this version's packages: the feed names each against the release that carries it.
          files: |
            windows/dist/velopack/ClaudeGraftApp-win-Setup.exe
            windows/dist/velopack/ClaudeGraftApp-${{ steps.version.outputs.version }}-*.nupkg
            windows/dist/velopack/releases.win.json
